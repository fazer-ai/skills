name: Check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  marketplace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Check marketplace.json
        run: node scripts/check-marketplace.mjs

      - name: Test the checker
        run: node --test 'scripts/*.test.mjs'
